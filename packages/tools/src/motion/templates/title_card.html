<!-- HyperFrames template: title_card (kicker + bold headline + accent bar + subtitle) -->
<div class="stage-center" data-template="title_card">
  <div class="tc-card" id="tc-card">
    {{#kicker}}<div class="tc-kicker" id="tc-kicker">{{kicker}}</div>{{/kicker}}
    <div class="tc-title" id="tc-title">{{title}}</div>
    <div class="tc-bar" id="tc-bar"></div>
    {{#subtitle}}<div class="tc-subtitle" id="tc-subtitle">{{subtitle}}</div>{{/subtitle}}
  </div>
</div>
