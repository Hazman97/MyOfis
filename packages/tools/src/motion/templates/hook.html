<!-- HyperFrames template: hook (1–3 pop-in lines for TikTok/Reels openings) -->
<div class="stage-center" data-template="hook">
  {{#badge}}<div class="hook-badge" id="hook-badge">{{badge}}</div>{{/badge}}
  <div class="hook-stack">
    {{#lines}}<div class="hook-line" id="hook-line-{{index}}">{{text}}</div>{{/lines}}
  </div>
  {{#subtext}}<div class="hook-subtext" id="hook-subtext">{{subtext}}</div>{{/subtext}}
</div>
