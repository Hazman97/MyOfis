<!-- HyperFrames template: lower_third (speaker name + role banner) -->
<div class="lt-wrapper lt-{{align}}" id="lt-box" data-template="lower_third">
  <div class="lt-accent-bar"></div>
  <div class="lt-content">
    <div class="lt-name">{{name}}</div>
    {{#role}}<div class="lt-role" id="lt-role">{{role}}</div>{{/role}}
  </div>
</div>
