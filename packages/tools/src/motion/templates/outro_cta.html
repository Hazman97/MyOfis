<!-- HyperFrames template: outro_cta (end-screen call to action card with pulsing button) -->
<div class="stage-center" data-template="outro_cta">
  <div class="cta-card" id="cta-card">
    <div class="cta-headline">{{headline}}</div>
    {{#handle}}<div class="cta-handle" id="cta-handle">{{handle}}</div>{{/handle}}
    <div class="cta-button" id="cta-button">{{action}}</div>
  </div>
</div>
